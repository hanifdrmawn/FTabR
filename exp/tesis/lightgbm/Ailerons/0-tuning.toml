seed = 0
function = "bin.lightgbm_.main"
n_trials = 100
timeout = "__null__"

[sampler]
n_startup_trials = 20

[space]
seed = 0

[space.data]
seed = 0
num_policy = "__null__"
cache = true
path = ":data/regression-num-medium-0-Ailerons"
cat_policy = "__null__"
y_policy = "standard"

[space.model]
n_estimators = 4000
num_leaves = ["_tune_","int",20,300]
learning_rate = ["_tune_","loguniform",0.001,1.0]
colsample_bytree = ["_tune_","uniform",0.5,1.0]
subsample = ["_tune_","uniform",0.5,1.0]
reg_lambda = ["_tune_","?loguniform",0.0,0.1,10.0]
min_child_samples = ["_tune_","int",5,100]
verbose = -1

[space.fit]
early_stopping_rounds = 200
verbose = false
